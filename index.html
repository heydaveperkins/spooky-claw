<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#36244a">
  <title>Spooky Claw</title>
  <link rel="stylesheet" href="styles.css?v=202610302030">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="game" aria-label="Spooky Claw claw machine game"></canvas>
    <div class="loading" id="loading">Loading…</div>
  </main>

  <!-- Shown on phones held upright; the game pauses underneath -->
  <div class="rotate" id="rotate" role="alert">
    <div class="rotate-phone" aria-hidden="true"></div>
    <p>Rotate your phone</p>
    <p class="rotate-sub">Spooky Claw plays in landscape</p>
  </div>

  <noscript><p class="noscript">Spooky Claw needs JavaScript.</p></noscript>

  <!-- The ?v= stamps make browsers fetch fresh copies after an update;
       tools/build.sh bumps them on every build. -->
  <!-- Rive web runtime, pinned and vendored: @rive-app/webgl2 2.44.2 -->
  <script src="vendor/rive-webgl2-2.44.2/rive.js"></script>
  <script src="game.js?v=202610302030"></script>
</body>
</html>
